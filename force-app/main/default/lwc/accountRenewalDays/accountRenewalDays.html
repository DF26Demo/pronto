<template>
    <lightning-card title="Account Renewal" icon-name="standard:date_time">
        <template if:true={hasRenewalDate}>
            <!-- Arr! Display the countdown to renewal day -->
            <div class="slds-p-around_medium slds-text-align_center">
                <div class="slds-text-heading_large slds-m-bottom_small">
                    {displayDays}
                </div>
                <div class="slds-text-body_regular slds-text-color_weak">
                    days
                </div>
                
                <!-- Message banner with color based on urgency -->
                <div class="slds-m-top_medium">
                    <div class={messageVariant}>
                        {renewalMessage}
                    </div>
                </div>
            </div>
        </template>
        
        <template if:false={hasRenewalDate}>
            <template if:false={error}>
                <!-- No renewal date found - uncharted waters! -->
                <div class="slds-p-around_medium slds-text-align_center">
                    <p class="slds-text-color_weak">No renewal date set for this account.</p>
                </div>
            </template>
        </template>

        <template if:true={error}>
            <!-- Blimey! We've hit an iceberg -->
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    Error loading renewal data: {error.body.message}
                </div>
            </div>
        </template>
    </lightning-card>
</template>
