<template>
    <lightning-card title="Renewal Countdown" icon-name="standard:contract">
        <template if:true={hasRenewalDate}>
            <!-- Arr! Display the countdown to renewal day -->
            <div class="slds-p-around_medium slds-text-align_center">
                <div class={countdownClass}>
                    <div class="slds-text-heading_large slds-m-bottom_x-small">
                        {daysUntilRenewal}
                    </div>
                    <div class="slds-text-body_regular slds-text-color_weak">
                        {countdownLabel}
                    </div>
                </div>
                <div class="slds-m-top_small slds-text-body_small slds-text-color_weak">
                    Renewal Date: {formattedRenewalDate}
                </div>
            </div>
        </template>
        
        <template if:false={hasRenewalDate}>
            <template if:false={error}>
                <!-- No renewal date set - we're sailin' blind! -->
                <div class="slds-p-around_medium slds-text-align_center">
                    <lightning-icon icon-name="utility:info" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                    <p class="slds-text-color_weak">No renewal date set for this account.</p>
                </div>
            </template>
        </template>

        <template if:true={error}>
            <!-- Blimey! We've hit an error -->
            <div class="slds-p-around_medium">
                <div class="slds-text-color_error">
                    Error loading renewal date: {error}
                </div>
            </div>
        </template>
    </lightning-card>
</template>
