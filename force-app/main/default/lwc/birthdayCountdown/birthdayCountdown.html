<template>
    <lightning-card title="Birthday Countdown" icon-name="standard:event">
        <template if:true={isLoading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template if:true={hasError}>
            <div class="slds-p-around_medium">
                <p class="slds-text-color_error">Blimey! Error loading the birthdate.</p>
            </div>
        </template>

        <template if:true={contact.data}>
            <div class="slds-p-around_medium">
                <div class="slds-text-align_center">
                    <p class="slds-text-heading_large slds-m-bottom_small">
                        {displayMessage}
                    </p>
                    <template if:true={birthdate}>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Birthdate: {birthdate}
                        </p>
                    </template>
                </div>
            </div>
        </template>
    </lightning-card>
</template>
